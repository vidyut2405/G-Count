<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090B"><title>500 Club — 20 Sets. 500 Reps.</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{font-family:'Plus Jakarta Sans',sans-serif;color:#fafafa;background:#09090b;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0}button:active{transform:scale(.97)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #a3e635;outline-offset:3px}.app{max-width:460px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:22px 24px 24px}.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}.brand{font-size:19px;letter-spacing:-.06em;font-weight:800;display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#a3e635;color:#101408;letter-spacing:0}.lime{color:#a3e635}.muted{color:#a1a1aa}.micro{font-size:11px;letter-spacing:.1em;font-weight:600;text-transform:uppercase;color:#8c8c96}.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.panel{background:#121215;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:20px}.primary{background:#a3e635;color:#111407;font-weight:800;border-radius:19px;width:100%;padding:20px;font-size:16px;transition:transform .2s}.icon{background:none;color:#a1a1aa;padding:9px;font-size:20px}.title{font-size:43px;font-weight:800;letter-spacing:-.055em;line-height:1.08;margin:14px 0}.description{font-size:13px;line-height:1.65;color:#a1a1aa}.field{background:#202024;color:#fafafa;border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:14px;width:100%;outline:0}.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.pill{font-size:11px;padding:9px 12px;background:none;border:1px solid #37373c;color:#a1a1aa;border-radius:30px}.pill.selected{border-color:#a3e635;color:#a3e635;background:#a3e6350d}.seg{display:flex;gap:4px;padding:4px;background:#202024;border-radius:13px}.seg button{flex:1;border-radius:10px;background:transparent;color:#a1a1aa;font-size:12px;font-weight:700;padding:11px 5px}.seg button.selected{background:#39393f;color:white}.divider{height:1px;background:#ffffff12;margin:20px 0}.grow{flex:1}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.big{font-size:68px;font-weight:800;line-height:1;letter-spacing:-.06em}.setgrid{display:grid;grid-template-columns:28px repeat(5,minmax(0,1fr));gap:8px;align-items:center;margin:10px 0}.block{height:38px;border:1px solid #34343a;border-radius:9px;display:grid;place-items:center;background:#242428;font-size:12px;font-weight:700}.block.done{background:#a3e635;color:#111;border-color:#a3e635}.block.active{color:#a3e635;border-color:#a3e635;animation:pulse 2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 3px #a3e63520}}.work{flex:1;display:flex;flex-direction:column;min-height:0}.hero{flex:1;min-height:195px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px 0}.ringbox{width:194px;height:194px;position:relative;display:grid;place-items:center}.ringbox svg{position:absolute;inset:0;transform:rotate(-90deg)}.ringcenter{position:relative}.bottom{margin-top:auto}.sheetback{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:5}.sheet{background:#18181b;border:1px solid #ffffff18;border-radius:28px 28px 0 0;padding:30px 26px 40px;width:100%;max-width:460px}.choice{padding:19px;border-radius:18px;width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;font-weight:700}.secondary{background:#29292e;color:#fafafa;border:1px solid #ffffff16}.fade{animation:fade .3s ease-out}@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(max-height:710px){.app{padding-top:12px;padding-bottom:12px}.block{height:30px}.hero{min-height:160px}.title{font-size:37px}}
</style></head><body><div id="app" class="app"><header class="top"><div class="brand"><div class="mark">5</div><span>500<span class="lime">.</span> CLUB</span></div><div id="tools"></div></header><main id="screen" class="grow" style="display:flex;flex-direction:column"></main></div><div id="modal"></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),presets=['Push-ups','Kettlebell Swings','Air Squats','Cable Rows'],KEY='500club-original-history';let state={screen:'setup',exercise:'Push-ups',load:'body',unit:'kg',weight:16,mode:'rest',rest:45,interval:60,done:0,phase:'work',remaining:0,restTotal:0,extra:0,elapsed:0,started:0,paused:false,sound:true,voice:false,history:[],guard:false,saved:false};try{state.history=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}let clock=null,deadline=0,emomDeadline=0,pauseAt=0,wake=null,audio=null;const mono=n=>String(n).padStart(2,'0'),fmt=t=>mono(Math.floor(Math.max(0,t)/60))+':'+mono(Math.floor(Math.max(0,t)%60)),esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),btn=(id,label,cls='')=>`<button id="${id}" class="${cls}">${label}</button>`,on=(id,fn)=>{const x=$(id);if(x)x.addEventListener('click',fn)};function beep(f=660){if(!state.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.1,audio.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.2);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.21)}catch{}}function say(t){if(state.voice&&'speechSynthesis'in window){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.92;speechSynthesis.speak(u)}catch{}}}async function awake(){try{if(!wake&&navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch{}}function sleep(){if(wake){wake.release().catch(()=>{});wake=null}}document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.screen==='work'&&!state.paused)awake()});function render(){const s=state;$('tools').innerHTML=s.screen==='work'?btn('sound',s.sound?'◖))':'◖×','icon')+btn('voice',s.voice?'◉':'◎','icon')+btn('pause',s.paused?'▶':'Ⅱ','icon')+btn('reset','↺','icon'):btn('history','◷','icon');on('sound',()=>{s.sound=!s.sound;renderTools()});on('voice',()=>{s.voice=!s.voice;renderTools()});on('pause',pause);on('reset',reset);on('history',history);if(s.screen==='setup')setup();else if(s.screen==='work')work();else summary()}function renderTools(){render()}
function setup(){let s=state;$('screen').innerHTML=`<div class="fade" style="padding-top:36px"><div class="micro lime">THE HIGH-VOLUME PROTOCOL</div><h1 class="title">Show up.<br>Put in the <span class="lime">reps.</span></h1><p class="description">20 sets. 25 reps. One goal.<br>A simpler way to get to 500.</p></div><div class="panel" style="margin-top:22px"><div class="micro" style="margin-bottom:12px">01 / EXERCISE</div><input class="field" id="exercise" maxlength="60" placeholder="Name your exercise" value="${esc(s.exercise)}"><div class="pills" id="presets"></div><div class="divider"></div><div class="micro" style="margin-bottom:12px">02 / LOAD TYPE</div><div class="seg" id="loads"></div><div id="weightarea" style="margin-top:12px"></div><div class="divider"></div><div class="micro" style="margin-bottom:12px">03 / PACING</div><div class="seg" id="modes"></div><div id="pacearea" style="margin-top:12px"></div></div><div class="grow" style="min-height:20px"></div><div class="row" style="padding:18px 0"><div><div class="micro">TODAY'S TARGET</div><div class="mono" style="font-size:24px;font-weight:800;margin-top:5px">500 <span class="muted" style="font-size:12px">REPS</span></div></div><div style="text-align:right"><div class="micro">TOTAL SETS</div><div class="mono" style="font-size:24px;font-weight:800;margin-top:5px">20 <span class="muted" style="font-size:12px">× 25</span></div></div></div>${btn('start','Start 500 Reps →','primary')}<div class="micro" style="text-align:center;margin:15px 0 0">NO ACCOUNT. JUST WORK.</div>`;on('exercise',()=>{});$('exercise').oninput=e=>{s.exercise=e.target.value;drawPresets()};drawPresets();drawLoad();drawMode();on('start',start)}function drawPresets(){$('presets').innerHTML=presets.map((p,i)=>btn('p'+i,p,'pill '+(state.exercise===p?'selected':''))).join('');presets.forEach((p,i)=>on('p'+i,()=>{state.exercise=p;$('exercise').value=p;drawPresets()}))}function drawLoad(){let s=state;$('loads').innerHTML=btn('body','Bodyweight',s.load==='body'?'selected':'')+btn('weighted','Weighted',s.load==='weighted'?'selected':'');on('body',()=>{s.load='body';drawLoad()});on('weighted',()=>{s.load='weighted';drawLoad()});$('weightarea').innerHTML=s.load==='body'?'<div class="muted" style="font-size:11px">No additional equipment load.</div>':`<div class="row"><input id="weight" class="field" type="number" min="0" step="0.5" value="${s.weight}"><div class="seg" style="width:130px;flex-shrink:0">${btn('kg','kg',s.unit==='kg'?'selected':'')}${btn('lbs','lbs',s.unit==='lbs'?'selected':'')}</div></div><div class="micro" style="margin-top:8px">EXTERNAL LOAD PER REP</div>`;if(s.load==='weighted'){$('weight').oninput=e=>s.weight=Math.max(0,Number(e.target.value)||0);on('kg',()=>{s.weight=Number($('weight').value)||0;s.unit='kg';drawLoad()});on('lbs',()=>{s.weight=Number($('weight').value)||0;s.unit='lbs';drawLoad()})}}function drawMode(){let s=state;$('modes').innerHTML=btn('standard','Standard Rest',s.mode==='rest'?'selected':'')+btn('emom','EMOM Clock',s.mode==='emom'?'selected':'');on('standard',()=>{s.mode='rest';drawMode()});on('emom',()=>{s.mode='emom';drawMode()});$('pacearea').innerHTML=`<div class="row"><div><div style="font-size:12px;font-weight:700">${s.mode==='rest'?'Recovery countdown':'Start-to-start interval'}</div><div class="muted" style="font-size:10px;margin-top:5px">${s.mode==='rest'?'After each completed set':'Next set begins on the interval'}</div></div><div class="row" style="gap:8px">${btn('minus','−','icon') }<span class="mono" id="pace" style="font-size:17px;font-weight:800;min-width:42px;text-align:center">${s.mode==='rest'?s.rest:s.interval}s</span>${btn('plus','+','icon')}</div></div>`;const change=d=>{let k=s.mode==='rest'?'rest':'interval';s[k]=Math.min(300,Math.max(k==='rest'?5:30,s[k]+d));$('pace').textContent=s[k]+'s'};on('minus',()=>change(-5));on('plus',()=>change(5))}
function start(){let s=state;s.exercise=$('exercise').value.trim();if(!s.exercise){$('exercise').focus();return}s.screen='work';s.done=0;s.phase='work';s.started=Date.now();s.elapsed=0;s.paused=false;s.extra=0;s.guard=false;s.saved=false;emomDeadline=Date.now()+s.interval*1000;awake();beep();render();clearInterval(clock);clock=setInterval(tick,150)}function tick(){let s=state;if(s.screen!=='work'||s.paused||s.guard)return;let now=Date.now();s.elapsed=(now-s.started)/1000;if(s.phase==='rest'){let old=Math.ceil(s.remaining);s.remaining=Math.max(0,((s.mode==='emom'?emomDeadline:deadline)-now)/1000);let next=Math.ceil(s.remaining);if(next!==old&&next>=1&&next<=3)beep(next===1?880:660);if(s.remaining<=0){s.phase='work';if(s.mode==='emom')emomDeadline=now+s.interval*1000;beep(880);say('Go. Set '+(s.done+1));work();return}if($('timer'))$('timer').textContent=fmt(Math.ceil(s.remaining));if($('ring'))$('ring').style.strokeDashoffset=String(2*Math.PI*77*(1-s.remaining/Math.max(1,s.restTotal)))}else if(s.mode==='emom'&&now>=emomDeadline)emomDeadline=now+s.interval*1000;if($('elapsed'))$('elapsed').textContent=fmt(s.elapsed)}function work(){let s=state,resting=s.phase==='rest',current=Math.min(20,s.done+1);$('screen').innerHTML=`<div class="work fade"><div class="row" style="padding:20px 0"><div style="min-width:0"><div class="micro lime">WORKOUT IN PROGRESS</div><h2 style="font-size:22px;letter-spacing:-.03em;margin:6px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.exercise)}</h2></div><div style="text-align:right;flex-shrink:0"><div class="micro">ELAPSED</div><div id="elapsed" class="mono" style="font-weight:700;margin-top:6px">${fmt(s.elapsed)}</div></div></div><div class="panel" style="padding:17px"><div class="row"><span class="micro">THE 20-SET GRID</span><span class="micro mono lime">${Math.round(s.done/20*100)}%</span></div>${Array.from({length:4},(_,q)=>`<div class="setgrid"><span class="micro mono">Q0${q+1}</span>${Array.from({length:5},(_,i)=>{let n=q*5+i+1;return `<div class="block ${n<=s.done?'done':n===current&&!resting?'active':''}">${n<=s.done?'✓':mono(n)}</div>`}).join('')}</div>`).join('')}<div class="divider" style="margin:14px 0 12px"></div><div class="row"><span class="micro">QUARTER ${mono(Math.min(4,Math.floor(s.done/5)+1))}</span><span class="micro mono">${s.done*25} / 500 REPS</span></div></div><div class="hero">${resting?`<div class="ringbox"><svg viewBox="0 0 194 194"><circle cx="97" cy="97" r="77" stroke="#303035" stroke-width="7" fill="none"/><circle id="ring" cx="97" cy="97" r="77" stroke="#a3e635" stroke-width="7" stroke-linecap="round" fill="none" stroke-dasharray="${2*Math.PI*77}" stroke-dashoffset="${2*Math.PI*77*(1-s.remaining/Math.max(1,s.restTotal))}"/></svg><div class="ringcenter"><div class="micro">${s.mode==='emom'?'NEXT INTERVAL':'RECOVERY'}</div><div id="timer" class="mono" style="font-size:48px;font-weight:800;margin:8px 0">${fmt(Math.ceil(s.remaining))}</div><div class="muted" style="font-size:11px">Breathe. Reset.</div></div></div>`:`<div><div class="micro" style="margin-bottom:12px">CURRENT SET</div><div class="big mono">${mono(current)}<span class="muted" style="font-size:27px"> / 20</span></div><div class="divider" style="width:50px;margin:22px auto"></div><div class="mono" style="font-size:29px;font-weight:800">${s.done*25} <span class="muted">/ 500</span></div><div class="micro" style="margin-top:9px">REPS COMPLETED</div></div>`}</div><div class="bottom"><div class="row" style="margin-bottom:13px"><span class="micro">${s.paused?'WORKOUT PAUSED':resting?'REST PERIOD':'25 REPS TO COMPLETE'}</span><span class="micro">${s.mode==='emom'?'EMOM '+s.interval+'S':'REST '+(s.rest+s.extra)+'S'}</span></div>${btn('action',resting?'Skip Rest →':'Complete Set '+current+' ✓','primary')}<div class="micro" style="text-align:center;margin-top:14px">${s.paused?'RESUME TO CONTINUE':'ONE SET AT A TIME. YOU’VE GOT THIS.'}</div></div></div>`;on('action',()=>{if(s.paused)return;if(s.phase==='rest')skip();else complete()});$('action').disabled=s.paused}function complete(){let s=state;s.done++;beep(520);if(s.done===20){finish();return}if(s.done%5===0){s.guard=true;guard();return}rest()}function rest(){let s=state;s.phase='rest';s.restTotal=s.mode==='rest'?s.rest+s.extra:Math.max(0,(emomDeadline-Date.now())/1000);s.remaining=s.restTotal;if(s.mode==='rest')deadline=Date.now()+s.restTotal*1000;if(s.mode==='emom'&&s.remaining<=0){s.phase='work';emomDeadline=Date.now()+s.interval*1000}work()}function skip(){state.phase='work';state.remaining=0;if(state.mode==='emom')emomDeadline=Date.now()+state.interval*1000;beep(880);work()}function guard(){let s=state,q=s.done/5;$('modal').innerHTML=`<div class="sheetback"><div class="sheet fade"><div style="height:4px;width:40px;border-radius:5px;background:#555;margin:0 auto 26px"></div><div class="micro lime">QUARTER ${mono(q)} COMPLETE · ${s.done*25} REPS</div><h2 style="font-size:28px;letter-spacing:-.04em">How's your form?</h2><p class="description">Check in before the next 125 reps.</p>${btn('strong','<span>Strong<br><small>Keep my current pace</small></span><span>→</span>','choice primary')}${btn('fatigue','<span>Fatiguing<br><small>Add 15 seconds of recovery</small></span><span class="lime">+15s</span>','choice secondary')}</div></div>`;on('strong',()=>guardEnd(false));on('fatigue',()=>guardEnd(true));say('Quarter '+q+' complete. '+s.done*25+' reps down.')}function guardEnd(f){if(f)state.extra+=15;$('modal').innerHTML='';state.guard=false;if(state.mode==='emom'&&Date.now()>=emomDeadline)emomDeadline=Date.now()+state.interval*1000;rest()}function pause(){let s=state;if(s.screen!=='work'||s.guard)return;s.paused=!s.paused;if(s.paused)pauseAt=Date.now();else{let d=Date.now()-pauseAt;s.started+=d;if(s.mode==='rest'&&s.phase==='rest')deadline+=d;if(s.mode==='emom')emomDeadline+=d;awake()}render()}function reset(){if(!state.paused)pause();dialog('End this workout?','Your current progress will not be saved.','End workout',()=>{clearInterval(clock);sleep();state.screen='setup';close();render()})}function dialog(title,desc,action,yes){$('modal').innerHTML=`<div class="sheetback"><div class="sheet fade"><h2>${title}</h2><p class="description">${desc}</p>${btn('yes',action,'primary')}${btn('cancel','Cancel','choice secondary')}</div></div>`;on('yes',yes);on('cancel',close)}function close(){$('modal').innerHTML=''}function finish(){clearInterval(clock);sleep();state.elapsed=(Date.now()-state.started)/1000;state.screen='summary';beep(880);say('Five hundred reps complete. Great work.');render()}function summary(){let s=state,volume=s.load==='weighted'?s.weight*500:0;$('screen').innerHTML=`<div class="fade" style="text-align:center;padding:42px 0 24px"><div style="width:64px;height:64px;background:#a3e635;border-radius:50%;color:#111;display:grid;place-items:center;font-size:32px;margin:auto">✓</div><div class="micro lime" style="margin-top:26px">MISSION COMPLETE</div><h1 style="font-size:35px;letter-spacing:-.05em">You did the work.</h1><p class="description">${esc(s.exercise)} · 20 sets complete</p></div><div class="panel"><div class="micro">TOTAL REPS</div><div class="big mono" style="margin:16px 0">500<span class="lime">.</span></div><div class="divider"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:28px 12px">${[['TOTAL DURATION',fmt(s.elapsed)],['AVG. TIME / SET',fmt(s.elapsed/20)],['TOTAL VOLUME',volume.toLocaleString()+' '+(s.load==='weighted'?s.unit:'kg')],['QUARTERS','04 / 04']].map(([a,b])=>`<div><div class="micro">${a}</div><div class="mono" style="font-size:22px;font-weight:700;margin-top:8px">${b}</div></div>`).join('')}</div></div><div class="grow"></div>${btn('save','Save & Finish →','primary')}<div class="micro" style="text-align:center;margin-top:15px">EVERY REP COUNTS.</div>`;on('save',()=>{if(!s.saved){s.history.unshift({id:Date.now(),exercise:s.exercise,date:new Date().toISOString(),seconds:Math.round(s.elapsed),reps:500,volume,unit:s.unit,mode:s.mode});try{localStorage.setItem(KEY,JSON.stringify(s.history))}catch{alert('Could not save history in this browser');return}s.saved=true}s.screen='setup';render()})}function history(){$('modal').innerHTML=`<div class="sheetback"><div class="sheet fade" style="max-height:85dvh;overflow:auto"><div class="row"><h2>Workout history</h2>${btn('close','×','icon')}</div>${state.history.length?state.history.map((h,i)=>`<div class="row" style="border-bottom:1px solid #ffffff16;padding:16px 0"><div><b>${esc(h.exercise)}</b><div class="description">${new Date(h.date).toLocaleDateString()} · ${fmt(h.seconds)} · ${h.volume} ${h.unit}</div></div><div class="row"><span class="mono lime">500</span>${btn('del'+i,'×','icon')}</div></div>`).join(''):'<p class="description" style="text-align:center;padding:40px 0">Your first 500 is waiting.</p>'}<div class="micro" style="text-align:center;margin-top:20px">${state.history.length} SESSIONS · ${state.history.length*500} TOTAL REPS</div></div></div>`;on('close',close);state.history.forEach((h,i)=>on('del'+i,()=>dialog('Delete session?','This workout will be permanently removed.','Delete',()=>{state.history=state.history.filter(x=>x.id!==h.id);localStorage.setItem(KEY,JSON.stringify(state.history));history()})))}render()})();
</script></body></html>
